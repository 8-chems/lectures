name: Render and Deploy Quarto Site

on:
  push:
    branches:
      - master

jobs:
  render:
    name: Render Quarto site (FR + EN)
    runs-on: ubuntu-latest

    steps:
      # Step 0: Checkout the repository
      - uses: actions/checkout@v4

      # Step 1: Get the PDF files
      - name: Get PDF files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./build/get-pdfs.sh
          ./build/get-pdfs.sh

      # Step 2: Set up Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 4: Install dependencies using uv + your scripts
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install -r pyproject.toml --system
          chmod +x ./build/requirements.sh
          sudo ./build/requirements.sh
          python -m spacy download en_core_web_sm || true

      # Step 5: Render English site
      - name: Render English site
        run: quarto render --to html

      # Step 6: Copy missing PDF folders into _site
      - name: Copy additional PDF folders to _site
        run: |
          echo "--- PDF folder structure before copy ---"
          find pdfs/ -type d | sort || echo "No pdfs/ directory found at root"

          # Ensure destination exists
          mkdir -p _site/pdfs

          # Copy practical_works if it exists
          if [ -d "pdfs/practical_works" ]; then
            cp -r pdfs/practical_works _site/pdfs/
            echo "Copied pdfs/practical_works → _site/pdfs/practical_works"
          else
            echo "WARNING: pdfs/practical_works not found — skipping"
          fi

          # Copy directed_works if it exists
          if [ -d "pdfs/directed_works" ]; then
            cp -r pdfs/directed_works _site/pdfs/
            echo "Copied pdfs/directed_works → _site/pdfs/directed_works"
          else
            echo "WARNING: pdfs/directed_works not found — skipping"
          fi

          echo "--- _site/pdfs structure after copy ---"
          find _site/pdfs/ -type f | sort

      # Step 7: Fix absolute paths for GitHub Pages
      - name: Fix PDF Paths for GitHub Pages
        run: |
          REPO_NAME=${{ github.event.repository.name }}

          # Fix double-quoted absolute paths: "/pdfs/ → "/REPO/pdfs/
          find _site -type f -name "*.html" -exec sed -i "s|\"/pdfs/|\"/$REPO_NAME/pdfs/|g" {} +

          # Fix single-quoted absolute paths: '/pdfs/ → '/REPO/pdfs/
          find _site -type f -name "*.html" -exec sed -i "s|'/pdfs/|'/$REPO_NAME/pdfs/|g" {} +

          # Fix unquoted attribute paths: =/pdfs/ → =/REPO/pdfs/
          find _site -type f -name "*.html" -exec sed -i "s|=/pdfs/|=/$REPO_NAME/pdfs/|g" {} +

          # Fix backtick template literals: `/pdfs/ → `/REPO/pdfs/
          find _site -type f -name "*.html" -exec sed -i "s|\`/pdfs/|\`/$REPO_NAME/pdfs/|g" {} +

          # Fix .js files (PDF viewers like PDF.js construct URLs in JS)
          find _site -type f -name "*.js" -exec sed -i "s|\"/pdfs/|\"/$REPO_NAME/pdfs/|g" {} +
          find _site -type f -name "*.js" -exec sed -i "s|'/pdfs/|'/$REPO_NAME/pdfs/|g" {} +
          find _site -type f -name "*.js" -exec sed -i "s|\`/pdfs/|\`/$REPO_NAME/pdfs/|g" {} +

          echo "Fixed PDF paths in HTML/JS files for /$REPO_NAME/pdfs/"

          # Verify — show any remaining absolute /pdfs/ references
          echo "--- Remaining unfixed /pdfs/ references ---"
          grep -rn '"/pdfs/' _site/ && echo "WARNING: double-quote refs remain" || echo "OK: no double-quote refs"
          grep -rn "'/pdfs/" _site/ && echo "WARNING: single-quote refs remain" || echo "OK: no single-quote refs"
          grep -rn '`/pdfs/' _site/ && echo "WARNING: backtick refs remain"     || echo "OK: no backtick refs"

      # Step 8: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
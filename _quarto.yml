            - text: "📄 DW3 Part 4 — EDA"
              href: modules/advanced/data_science/td/dw3_part4.qmd
            - text: "📄 DW4 Part 1 — Visualization"
              href: modules/advanced/data_science/td/dw4_part1.qmd
            - text: "📄 DW4 Part 2 — Visualization"
              href: modules/advanced/data_science/td/dw4_part2.qmd
            - text: "📄 DW5 — Experimental Design"

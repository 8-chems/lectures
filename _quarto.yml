# WEBSITE ARCHITECTURE ---------------------

website:
  title: "Data Science Academy"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  favicon: content/images/icon.png

  navbar:
    background: "white"
    search: true
    title: false
    left:
      - file: index.qmd
        text: "🏠 Home"
      - text: "🎓 Fundamental Modules"
        menu:
          - text: "🔷 OOP"
            href: modules/fundamental/oop/index.qmd
          - text: "🌲 Data Structures"
            href: modules/fundamental/data_structures/index.qmd
          - text: "🗄️ Databases"
            href: modules/fundamental/database/index.qmd
          - text: "💻 Programming"
            href: modules/fundamental/programming/index.qmd
          - text: "🐍 Python & Java"
            href: modules/fundamental/python_java/index.qmd
      - text: "🚀 Advanced Modules"
        menu:
          - text: "📊 Data Science"
            href: modules/advanced/data_science/index.qmd
          - text: "🤖 Machine Learning"
            href: modules/advanced/machine_learning/index.qmd
          - text: "📈 Statistics"
            href: modules/advanced/statistics/index.qmd
          - text: "🧠 Artificial Intelligence"
            href: modules/advanced/ai/index.qmd

    tools:
      - icon: github
        href: https://github.com/8-chems/lectures

  sidebar:
    - id: data-science
      title: "Data Science"
      style: "docked"
      collapse-level: 1
      contents:
        - modules/advanced/data_science/index.qmd

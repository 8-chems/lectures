          contents:
            - modules/advanced/data_science/course/chapter_1/index.qmd
            - modules/advanced/data_science/course/chapter_2/index.qmd
            - modules/advanced/data_science/course/chapter_3/index.qmd
            - modules/advanced/data_science/course/chapter_4/index.qmd
            - modules/advanced/data_science/course/chapter_5/index.qmd
        - section: "📝 Directed Works (DW)"
          contents:
            - text: "📄 DW1 — Introduction"
              href: modules/advanced/data_science/td/dw1.qmd
            - text: "📄 DW2 Part 1 — Data Acquisition"
              href: modules/advanced/data_science/td/dw2_part1.qmd
            - text: "📄 DW2 Part 2 — Data Acquisition"
              href: modules/advanced/data_science/td/dw2_part2.qmd
            - text: "📄 DW3 Part 2 — EDA"
              href: modules/advanced/data_science/td/dw3_part2.qmd

        - section: "🧪 Practical Works (PW)"
          contents:
            - text: "💻 PW1 — Getting Started"
              href: modules/advanced/data_science/tp/pw1.qmd
            - text: "💻 PW2 — NumPy"
              href: modules/advanced/data_science/tp/pw2.qmd
